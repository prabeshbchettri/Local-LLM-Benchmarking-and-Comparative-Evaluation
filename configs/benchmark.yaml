name: local-llm-benchmark
version: "1.0.0"
dataset_path: data/datasets/benchmark_v1.0.0.jsonl
random_seed: 42
request_timeout_seconds: 300
performance_repeats: 5
consistency_repeats: 3
cold_start_repeats: 3
full_runs: 3
warmup_requests: 1
cooldown_seconds_between_models: 60
cooldown_seconds_between_runs: 300
hardware_sample_interval_ms: 500
num_ctx: 4096
num_predict: 512
temperature: 0.0
top_p: 1.0
top_k: 40
repeat_penalty: 1.1
storage_dir: storage
results_dir: data/results
exports_dir: data/exports
log_dir: storage/logs
